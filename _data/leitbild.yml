title: "Leitbild"
intro: "Wofür wir uns einsetzen und wie wir Kirche mitgestalten wollen."
paragraphs:
  - >-
    Die Vielfalt unterschiedlicher persönlicher Überzeugungen gehört zum Wesen unserer Kirche.
    Wir sehen diese als grossen Reichtum, zu dem wir Sorge tragen wollen. Es ist unverkennbar,
    dass die einzelnen Ansichten voneinander abweichende Akzente setzen.
  - >-
    Im respektvollen Dialog miteinander können wir aufeinander zugehen und voneinander lernen.
    Wir sind in der Lage, uns offen mit der biblischen Botschaft auseinanderzusetzen und so die
    Bevölkerung in der Synode zu vertreten.
  - >-
    Unser Ziel ist eine moderne, tolerante und glaubwürdige Kirche, welche nah bei den Menschen
    ist und Glaube, Liebe und Hoffnung in die Welt trägt.
  - >-
    Der Synodalverein gestaltet unsere Landeskirche aktiv mit. Wir sind überzeugt, dass ein
    lebendiger persönlicher Glaube Motivation und Grundlage für das Engagement in Kirche und
    Gesellschaft ist.
  - >-
    Wichtige christliche Werte wie Freiheit, Verantwortung und Ehrlichkeit prägen unsere Arbeit.
    Wir setzen uns für eine offene und freie Gesellschaft ein. Dazu gehört es auch, die Kirche
    kritisch zu hinterfragen. Nur eine mutige Kirche kann sich neuen Gegebenheiten anpassen und
    ist gerüstet für die Herausforderungen der Zukunft. Dazu gehören auch der verantwortungsvolle
    Umgang mit der Schöpfung und den Ressourcen sowie die Achtung der Würde unserer Mitmenschen
    und anderer Lebewesen.
