description: |
  ## Herzlich willkommen im Synodalverein!

  Wir treten für eine Kirche ein, die sich zu erneuern und zu verändern wagt und gerade so 
  zeitgemäss und den Menschen nahe ist, ohne ihr Zentrum aus den Augen zu verlieren. 
  Wenn Sie eine solche Kirche mitgestalten möchten, dann sind Sie bei uns richtig.

  Der Synodalverein ist die traditionsreichste Fraktion der Zürcher Kirchensynode und 
  stellt sich seit 1896 den jeweils aktuellen Herausforderungen. Der Synodalverein denkt 
  und handelt nicht nach ideologischen Vorgaben, sondern agiert lösungsorientiert.
columns:
  - heading: "Spiritualität"
    tag: "spirituality"
    text: >
      Wir setzen uns für eine zeitgemässe reformierte Spiritualität ein. Die Menschen sind vom 
      Glauben getragen und inspiriert. Wir fördern eine Kirche, die nah bei Gott und den Menschen ist.
  - heading: "Identität"
    tag: "identity"
    text: >
      Ein wichtiger Baustein unserer reformierten Identität ist das Engagement für die Gesellschaft
      und für die Förderung der Gemeinschaft.
  - heading: "Reform"
    tag: "reformation"
    text: >
      Treu dem reformatorischen Gedanken nehmen wir die Menschen mit auf den Weg, die Kirche zukunftsfähig 
      und positiv zu gestalten. Wir gehen achtsam und wach auf Herausforderungen zu.
  - heading: "Fairantwortung"
    tag: "responsibility"
    text: >
      Mit den natürlichen Ressourcen und allem Leben gehen wir verantwortungsvoll und wertschätzend um. 
      Wir fördern eine Kirche, die sich für einen respektvollen Umgang mit der Schöpfung stark macht.
