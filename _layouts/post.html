<!DOCTYPE html>
<html lang="de-CH">

{% include head.html %}

<body>
    <div class="container-md">
        {% include minimal-header.html %}

        <main>
            <div class="blog-post container pt-3 pb-3">
                <article class="blog-post">
                    <h1>{{ page.title }}</h1>

                    {% if page.image %}
                    <div class="post-image mb-4">
                        <img src="{{ page.image | relative_url }}" class="img-fluid rounded" alt="{{ page.title }}">
                    </div>
                    {% endif %}

                    <div class="post-content">
                        {{ content }}
                    </div>
                </article>
            </div>
        </main>

        {% include footer.html %}
    </div>
</body>

</html>
